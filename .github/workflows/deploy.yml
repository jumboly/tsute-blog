name: Deploy blog

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blog-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # ビルドに使う Variables（APP_BASE_URL など）がこの Environment に置いてあるため
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: ${{ vars.APP_BASE_URL }}
          # ビーコンのトークンは HTML に埋め込まれて公開される値なので secrets ではなく vars に置く
          PUBLIC_CF_BEACON_TOKEN: ${{ vars.CF_BEACON_TOKEN }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

  pages:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write # デプロイがこのリポジトリの Actions から来たことを Pages が検証するため
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
