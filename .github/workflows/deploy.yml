name: Deploy blog

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blog-deploy
  cancel-in-progress: false

jobs:
  # GitHub Pages への移行中は、DNS を切り替えるまで配信を止めないよう S3 にも同じ成果物を置く。
  # 切り替え後は S3 / CloudFront の手順と AWS 関連の権限・変数を削除する
  build:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write # GitHub OIDC → AWS（長期アクセスキーを使わない）
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: ${{ vars.APP_BASE_URL }}
          # ビーコンのトークンは HTML に埋め込まれて公開される値なので secrets ではなく vars に置く
          PUBLIC_CF_BEACON_TOKEN: ${{ vars.CF_BEACON_TOKEN }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/
      # このロールは Blog バケットへの書き込みと invalidation しか持たない（アプリ側の edge スタックで定義）
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_BLOG_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Sync
        run: |
          aws s3 sync dist/ "s3://${{ vars.BLOG_BUCKET }}/" --delete \
            --cache-control "public,max-age=300" --exclude "_astro/*"
          aws s3 sync dist/_astro/ "s3://${{ vars.BLOG_BUCKET }}/_astro/" \
            --cache-control "public,max-age=31536000,immutable"
      # "/*" だとアプリと共有するディストリビューション上の /api/* 等のキャッシュまで消えるため、
      # ビルド成果物のトップレベルから Blog が配信するパスだけを組み立てる（記事や public/ の追加に自動追従させる）。
      # _astro/ はファイル名にハッシュを含み内容が変われば URL も変わるので対象外。
      - name: Invalidate
        run: |
          paths=("/")
          for entry in dist/*; do
            name="$(basename "$entry")"
            [ "$name" = "_astro" ] && continue
            if [ -d "$entry" ]; then
              # "/posts/*" は "/posts" 自体にマッチしないため両方指定する
              paths+=("/$name" "/$name/*")
            else
              paths+=("/$name")
            fi
          done
          printf 'Invalidating: %s\n' "${paths[@]}"
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "${paths[@]}"

  pages:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write # デプロイがこのリポジトリの Actions から来たことを Pages が検証するため
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
