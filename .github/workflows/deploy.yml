name: Deploy blog

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # GitHub OIDC → AWS（長期アクセスキーを使わない）

concurrency:
  group: blog-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: ${{ vars.APP_BASE_URL }}
      # このロールは Blog バケットへの書き込みと invalidation しか持たない（アプリ側の edge スタックで定義）
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_BLOG_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Sync
        run: |
          aws s3 sync dist/ "s3://${{ vars.BLOG_BUCKET }}/" --delete \
            --cache-control "public,max-age=300" --exclude "_astro/*"
          aws s3 sync dist/_astro/ "s3://${{ vars.BLOG_BUCKET }}/_astro/" \
            --cache-control "public,max-age=31536000,immutable"
      - name: Invalidate
        run: aws cloudfront create-invalidation --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/*" "/"
